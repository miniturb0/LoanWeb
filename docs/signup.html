<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>LoanWeb · Sign up</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="d-flex flex-column min-vh-100 bg-body-tertiary">
  <nav id="nav"></nav>
  <main class="container py-4">
    <nav id="breadcrumb"></nav>
    <div class="row justify-content-center">
      <div class="col-md-6 col-lg-5">
        <div class="card shadow-sm">
          <div class="card-body p-4">
            <h1 class="h3 mb-3">Create an account</h1>
            <form id="form" class="vstack gap-3">
              <div id="msg" hidden></div>
              <div>
                <label for="name" class="form-label">Full name</label>
                <input type="text" class="form-control" id="name" name="name" required autocomplete="name">
              </div>
              <div>
                <label for="email" class="form-label">Email</label>
                <input type="email" class="form-control" id="email" name="email" required autocomplete="email">
              </div>
              <div>
                <label for="password" class="form-label">Password</label>
                <input type="password" class="form-control" id="password" name="password" required minlength="6" autocomplete="new-password">
                <div class="form-text">At least 6 characters.</div>
              </div>
              <div>
                <label for="confirm" class="form-label">Confirm password</label>
                <input type="password" class="form-control" id="confirm" name="confirm" required minlength="6" autocomplete="new-password">
              </div>
              <button class="btn btn-success w-100" type="submit">Sign up</button>
              <p class="small text-body-secondary mb-0">Already have an account? <a href="login.html">Log in</a></p>
            </form>
          </div>
        </div>
      </div>
    </div>
  </main>
  <footer id="footer"></footer>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script type="module">
    import { initPage, showMessage } from "./js/common.js";

    const { backend } = await initPage({ guestOnly: true, crumbs: [["Home", "index.html"], ["Sign up"]] });
    const next = new URLSearchParams(location.search).get("next");

    document.getElementById("form").addEventListener("submit", async (e) => {
      e.preventDefault();
      const f = new FormData(e.target);
      const msg = document.getElementById("msg");
      if (f.get("password") !== f.get("confirm")) return showMessage(msg, "Passwords do not match.");
      try {
        await backend.signup(f.get("name"), f.get("email"), f.get("password"));
        const safeNext = next && /^[\w-]+\.html(\?[\w=&%.-]*)?$/.test(next) ? next : null;
        location.href = safeNext || "apply.html";
      } catch (err) {
        showMessage(msg, err.message);
      }
    });
  </script>
</body>
</html>
