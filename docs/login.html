<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>LoanWeb · Log in</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="d-flex flex-column min-vh-100 bg-body-tertiary">
  <nav id="nav"></nav>
  <main class="container py-4">
    <nav id="breadcrumb"></nav>
    <div class="row justify-content-center">
      <div class="col-md-6 col-lg-5">
        <div class="card shadow-sm">
          <div class="card-body p-4">
            <h1 class="h3 mb-3">Log in</h1>
            <form id="form" class="vstack gap-3">
              <div id="msg" hidden></div>
              <div>
                <label for="email" class="form-label">Email</label>
                <input type="email" class="form-control" id="email" name="email" required autocomplete="email">
              </div>
              <div>
                <label for="password" class="form-label">Password</label>
                <input type="password" class="form-control" id="password" name="password" required autocomplete="current-password">
              </div>
              <button class="btn btn-success w-100" type="submit">Log in</button>
              <p class="small text-body-secondary mb-0">No account? <a id="signupLink" href="signup.html">Sign up</a></p>
              <div class="alert alert-info small mb-0">Demo admin: <code>admin@loanweb.no</code> / <code>admin123</code></div>
            </form>
          </div>
        </div>
      </div>
    </div>
  </main>
  <footer id="footer"></footer>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script type="module">
    import { initPage, showMessage } from "./js/common.js";

    const { backend } = await initPage({ guestOnly: true, crumbs: [["Home", "index.html"], ["Log in"]] });
    const next = new URLSearchParams(location.search).get("next");
    if (next) document.getElementById("signupLink").href = `signup.html?next=${encodeURIComponent(next)}`;

    document.getElementById("form").addEventListener("submit", async (e) => {
      e.preventDefault();
      const f = new FormData(e.target);
      try {
        const user = await backend.login(f.get("email"), f.get("password"));
        // Only redirect to our own pages
        const safeNext = next && /^[\w-]+\.html(\?[\w=&%.-]*)?$/.test(next) ? next : null;
        location.href = safeNext || (user.role === "admin" ? "admin.html" : "apply.html");
      } catch (err) {
        showMessage(document.getElementById("msg"), err.message);
      }
    });
  </script>
</body>
</html>
