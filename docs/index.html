<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>LoanWeb · Loan calculator</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="d-flex flex-column min-vh-100 bg-body-tertiary">
  <nav id="nav"></nav>
  <main class="container py-4">
    <nav id="breadcrumb"></nav>
    <div class="mb-4">
      <h1 class="fw-bold">What will your loan cost?</h1>
      <p class="lead text-body-secondary">Choose an amount and a repayment period to see your monthly payment, interest, fees and total cost before you apply.</p>
    </div>
    <div class="card shadow-sm">
      <div class="card-body p-4" id="calculator"></div>
    </div>
    <a class="btn btn-success btn-lg mt-4" id="applyBtn" href="apply.html">Apply for this loan</a>
  </main>
  <footer id="footer"></footer>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script type="module">
    import { initPage } from "./js/common.js";
    import { mountCalculator } from "./js/calculator.js";

    const { user } = await initPage({ crumbs: [["Home", "index.html"], ["Loan calculator"]] });
    const applyBtn = document.getElementById("applyBtn");
    mountCalculator(document.getElementById("calculator"), {
      onChange: (r) => {
        const target = `apply.html?amount=${r.amount}&months=${r.months}`;
        applyBtn.href = user ? target : `login.html?next=${encodeURIComponent(target)}`;
      },
    });
  </script>
</body>
</html>
