<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>LoanWeb · My loans</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="d-flex flex-column min-vh-100 bg-body-tertiary">
  <nav id="nav"></nav>
  <main class="container py-4">
    <nav id="breadcrumb"></nav>
    <h1 class="fw-bold" id="hello">Apply for a loan</h1>
    <p class="text-body-secondary">Adjust the amount and period, check the cost, then send your application. An administrator will approve or reject it.</p>

    <div class="card shadow-sm mb-5">
      <div class="card-body p-4">
        <div id="calculator"></div>
        <hr class="my-4">
        <form id="form" class="vstack gap-3">
          <div id="msg" hidden></div>
          <div>
            <label for="purpose" class="form-label fw-semibold">What is the loan for?</label>
            <input type="text" class="form-control" id="purpose" name="purpose" maxlength="200" required placeholder="e.g. New car, renovation, studies">
          </div>
          <div class="form-check">
            <input class="form-check-input" type="checkbox" id="confirm" required>
            <label class="form-check-label" for="confirm">I have read the cost overview and want to apply for <b id="summary"></b>.</label>
          </div>
          <div><button class="btn btn-success" type="submit">Send application</button></div>
        </form>
      </div>
    </div>

    <h2 class="h4 mb-3">My applications</h2>
    <div class="vstack gap-3" id="loans"></div>
  </main>
  <footer id="footer"></footer>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script type="module">
    import { initPage, showMessage, nok, pct, fmtDate, escapeHtml, statusBadge } from "./js/common.js";
    import { mountCalculator } from "./js/calculator.js";
    import { LIMITS } from "./js/loan.js";

    const { backend, user } = await initPage({ require: "user", crumbs: [["Home", "index.html"], ["My loans"]] });
    document.getElementById("hello").textContent = `Hi ${user.name.split(" ")[0]}, apply for a loan`;

    const params = new URLSearchParams(location.search);
    const clamp = (v, min, max, d) => (v ? Math.min(max, Math.max(min, Math.round(v))) : d);
    const calc = mountCalculator(document.getElementById("calculator"), {
      amount: clamp(+params.get("amount"), LIMITS.minAmount, LIMITS.maxAmount, 150000),
      months: clamp(+params.get("months"), LIMITS.minMonths, LIMITS.maxMonths, 36),
      onChange: (r) => {
        document.getElementById("summary").textContent =
          `${nok(r.amount)} over ${r.months} months (${nok(r.monthlyPayment)}/month, total cost ${nok(r.totalCost)})`;
      },
    });

    async function renderLoans() {
      const loans = await backend.listLoans();
      const el = document.getElementById("loans");
      if (!loans.length) {
        el.innerHTML = `<div class="text-center text-body-secondary border rounded p-4">You have not applied for any loans yet.</div>`;
        return;
      }
      el.innerHTML = loans.map((l) => `
        <div class="card">
          <div class="card-body">
            <div class="d-flex justify-content-between align-items-center mb-2">
              <h3 class="h5 mb-0">${nok(l.amount)} · ${escapeHtml(l.purpose)}</h3>${statusBadge(l.status)}
            </div>
            <div class="d-flex flex-wrap gap-3 small text-body-secondary">
              <span>Period <b class="text-body">${l.months} months</b></span>
              <span>Monthly <b class="text-body">${nok(l.monthlyPayment)}</b></span>
              <span>Nominal <b class="text-body">${pct(l.nominalRate)}</b></span>
              <span>Effective <b class="text-body">${pct(l.effectiveRate)}</b></span>
              <span>Total cost <b class="text-body">${nok(l.totalCost)}</b></span>
              <span>Applied <b class="text-body">${fmtDate(l.createdAt)}</b></span>
            </div>
            ${l.status !== "pending"
              ? `<div class="alert ${l.status === "approved" ? "alert-success" : "alert-danger"} py-2 small mt-3 mb-0">
                   ${l.status === "approved" ? "Approved" : "Rejected"} ${fmtDate(l.decidedAt)}${l.adminNote ? `: ${escapeHtml(l.adminNote)}` : ""}
                 </div>`
              : ""}
          </div>
        </div>`).join("");
    }

    document.getElementById("form").addEventListener("submit", async (e) => {
      e.preventDefault();
      const msg = document.getElementById("msg");
      const r = calc.get();
      try {
        await backend.applyLoan(r.amount, r.months, new FormData(e.target).get("purpose"));
        e.target.reset();
        showMessage(msg, "Application sent! You can follow its status below.", "success");
        await renderLoans();
      } catch (err) {
        showMessage(msg, err.message);
      }
    });

    renderLoans();
  </script>
</body>
</html>
